{% set name = "zope.index" %}
{% set version = "8.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/zope_index-{{ version }}.tar.gz
  sha256: 8b414932a658d90aa6586a6acc826779136df4428cc72a4973bd58985edf9f19

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
  host:
    - pip
    - python
  run:
    - btrees >=4.4.1
    - persistent
    - python
    - setuptools
    - six
    - zope.interface

test:
  imports:
    - zope
    - zope.index
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/zopefoundation/zope.index
  summary: Indices for using with catalog like text, field, etc.
  license: ZPL-2.1
  license_file:
    - COPYRIGHT.txt
    - LICENSE.txt

extra:
  recipe-maintainers:
    - osamples
    - izahn
